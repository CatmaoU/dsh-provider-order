# @dsh-external/dsh-provider-order bundle patch: mount the provider-order plugin.
#
# Applied when this bundle appears in a profile's dsh.profile.bundles list.
# The node half (package root) registers the durable `provider-order` settings
# namespace and reorders LlmRuntime's adapters/directory Maps; the browser half
# (dsh.client) is discovered automatically through the package's dsh.client
# declaration + exports["./client"].

- insert:
    - id: provider-order
      name: '@dsh-external/dsh-provider-order'
